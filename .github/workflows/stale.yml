name: Stale Issues and PRs

on:
  schedule:
    - cron: "0 0 * * 0"

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v11
        with:
          stale-issue-message: "This issue has been inactive for 60 days. It will be closed in 7 days if no activity occurs."
          stale-pr-message: "This PR has been inactive for 45 days. It will be closed in 10 days if no activity occurs."
          days-before-issue-stale: 60
          days-before-pr-stale: 45
          days-before-issue-close: 7
          days-before-pr-close: 10
          exempt-issue-labels: "security,pinned"
          exempt-pr-labels: "security,pinned,WIP"
