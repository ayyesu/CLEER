name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.cjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Build macOS
        if: matrix.platform == 'mac'
        run: pnpm package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows
        if: matrix.platform == 'win'
        run: pnpm package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: pnpm package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: dist-app/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-app/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-website-version:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version.json
        run: |
          cat > website/public/version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "tag": "v${{ steps.version.outputs.VERSION }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": [
              { "name": "CLEER-Setup-${{ steps.version.outputs.VERSION }}.exe", "url": "https://github.com/ayyesu/CLEER/releases/latest/download/CLEER-Setup-${{ steps.version.outputs.VERSION }}.exe" },
              { "name": "CLEER-${{ steps.version.outputs.VERSION }}.dmg", "url": "https://github.com/ayyesu/CLEER/releases/latest/download/CLEER-${{ steps.version.outputs.VERSION }}.dmg" },
              { "name": "CLEER-${{ steps.version.outputs.VERSION }}-x86_64.AppImage", "url": "https://github.com/ayyesu/CLEER/releases/latest/download/CLEER-${{ steps.version.outputs.VERSION }}-x86_64.AppImage" }
            ]
          }
          EOF

      - name: Commit and push version update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/version.json
          git commit -m "chore: update website version to v${{ steps.version.outputs.VERSION }}"
          git push
