name: Build & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/check-version.cjs

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - name: Validate package
        run: node scripts/validate-package.js

      - name: Build macOS
        if: matrix.platform == 'mac'
        run: pnpm package:mac
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Windows
        if: matrix.platform == 'win'
        run: pnpm package:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Linux
        if: matrix.platform == 'linux'
        run: pnpm package:linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-build
          path: dist-app/*

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-app/*
          draft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-website-version:
    needs: release
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Regenerate version.ts
        run: node scripts/generate-version.cjs

      - name: Update version.json
        run: |
          cat > website/public/version.json << EOF
          {
            "version": "${{ steps.version.outputs.VERSION }}",
            "tag": "v${{ steps.version.outputs.VERSION }}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "assets": [
              { "name": "CLEER-Setup-${{ steps.version.outputs.VERSION }}.exe", "url": "https://github.com/ayyesu/CLEER/releases/latest/download/CLEER-Setup-${{ steps.version.outputs.VERSION }}.exe" },
              { "name": "CLEER-${{ steps.version.outputs.VERSION }}-arm64.dmg", "url": "https://github.com/ayyesu/CLEER/releases/latest/download/CLEER-${{ steps.version.outputs.VERSION }}-arm64.dmg" },
              { "name": "CLEER-${{ steps.version.outputs.VERSION }}-x86_64.AppImage", "url": "https://github.com/ayyesu/CLEER/releases/latest/download/CLEER-${{ steps.version.outputs.VERSION }}-x86_64.AppImage" }
            ]
          }
          EOF

      - name: Commit website version files to release branch
        env:
          # Admin PAT so the write to the protected release branch is allowed.
          GH_TOKEN: ${{ secrets.ADMIN_PAT }}
        run: |
          # Tag checkouts are detached; use the contents API so the update lands on
          # the release branch without a git push (no fast-forward conflicts).
          BRANCH="release"
          MESSAGE="chore: update website version to v${{ steps.version.outputs.VERSION }}"
          for FILE in website/public/version.json website/src/version.ts; do
            SHA="$(gh api "repos/$GITHUB_REPOSITORY/contents/$FILE?ref=$BRANCH" --jq .sha)"
            CONTENT="$(base64 -w0 "$FILE")"
            gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/$FILE" \
              -f message="$MESSAGE" \
              -f content="$CONTENT" \
              -f sha="$SHA" \
              -f branch="$BRANCH" > /dev/null
          done
          echo "Website version files updated on $BRANCH"
