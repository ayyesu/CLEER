appId: com.cleer.app
productName: CLEER
copyright: Copyright © 2026 CLEER
directories:
  output: dist-app
  buildResources: build
files:
  - dist/**/*
  - package.json
asar: true

# afterSign: scripts/notarize.js — uncomment when signing certificates are configured

mac:
  category: public.app-category.utilities
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CLEER
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  license: LICENSE

linux:
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: cleer@example.com
  vendor: CLEER
  synopsis: Computer Lifecycle, Efficiency & Environment Recovery
  description: Cross-platform disk space reclaimer
deb:
  depends:
    - gconf2
    - gconf-service
    - libnotify4
    - libappindicator1
    - libxtst6
    - libnss3
appImage:
  artifactName: ${productName}-${version}-${arch}.${ext}

publish:
  provider: github
  owner: ayyesu
  repo: CLEER
  releaseType: release
