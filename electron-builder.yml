appId: com.cleer.app
productName: CLEER
copyright: Copyright © 2026 CLEER
directories:
  output: dist-app
  buildResources: build
files:
  - dist/**/*
  - rules/**/*
  - package.json
asar: true
# Worker threads cannot always load scripts from inside the asar archive;
# unpack them so the scanner workers resolve reliably on all platforms.
asarUnpack:
  - dist/main/workers/**

# afterSign: scripts/notarize.js — uncomment when signing certificates are configured

mac:
  category: public.app-category.utilities
  darkModeSupport: true
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
dmg:
  artifactName: ${productName}-${version}-${arch}.${ext}
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  sign: false

win:
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CLEER
  artifactName: ${productName}-Setup-${version}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  license: LICENSE
portable:
  artifactName: ${productName}-${version}-win.${ext}

linux:
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  maintainer: cleer@example.com
  vendor: CLEER
  synopsis: Computer Lifecycle, Efficiency & Environment Recovery
  description: Cross-platform disk space reclaimer
appImage:
  artifactName: ${productName}-${version}-x86_64.${ext}

publish:
  provider: github
  owner: ayyesu
  repo: CLEER
  releaseType: release
